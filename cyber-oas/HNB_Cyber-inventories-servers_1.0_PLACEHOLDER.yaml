    cyber-inventories-servers_ipAddress:
      maxLength: 45
      minLength: 7
      type: string
      description: "Primary IP address.  45 characters accommodates IPv6.  [ANSWER-NEEDED Q19] SENSITIVITY - confirm with Cyber Architecture Review whether IP addresses may be returned, and to which consumers.  A fleet-wide list of hostnames, IPs, OS versions, internet-facing flags, and open vulnerability counts is a target list."
      example: "10.24.11.8"

    cyber-inventories-servers_operatingSystemName:
      maxLength: 100
      minLength: 1
      type: string
      description: "Operating system name."
      example: "Red Hat Enterprise Linux"
    cyber-inventories-servers_operatingSystemVersion:
      maxLength: 50
      minLength: 1
      type: string
      description: "Operating system version as reported by discovery."
      example: "9.4"

    cyber-inventories-servers_manufacturerName:
      maxLength: 100
      minLength: 1
      type: string
      description: "Hardware manufacturer."
      example: "Dell Inc."
    cyber-inventories-servers_modelName:
      maxLength: 100
      minLength: 1
      type: string
      description: "Hardware model.  Named modelName rather than modelIdentifier - the suffix Identifier is forbidden by the standard."
      example: "PowerEdge R750"
    cyber-inventories-servers_serialNumber:
      maxLength: 100
      minLength: 1
      type: string
      description: "Hardware serial.  NOTE: number is forbidden as a STANDALONE field name; serialNumber is a compound name and is acceptable.  [ANSWER-NEEDED Q20] Confirm with Governance."
      example: "7XK4LM3"

    cyber-inventories-servers_cpuCoreCount:
      type: integer
      minimum: 0
      maximum: 4096
      description: "Number of CPU cores.  Integer fields use minimum/maximum only - minLength/maxLength are not valid keywords for numbers."
      example: 16
    cyber-inventories-servers_memoryCapacityGigabytes:
      type: integer
      minimum: 0
      maximum: 1048576
      description: "Installed memory in gigabytes."
      example: 128

    cyber-inventories-servers_applicationCorrelationReference:
      maxLength: 30
      minLength: 1
      type: string
      description: "CMDB Correlation Id of the application this server supports.  Reference suffix is used because this points at an instance outside this collection.  THIS IS THE JOIN KEY between the servers and applications collections."
      example: "301196"
    cyber-inventories-servers_applicationName:
      maxLength: 255
      minLength: 1
      type: string
      description: "Name of the supported application as registered in the CMDB."
      example: "Enterprise Event Hub"
    cyber-inventories-servers_supportGroupName:
      maxLength: 255
      minLength: 1
      type: string
      description: "Assigned support group."
      example: "Infrastructure Linux Support"
    cyber-inventories-servers_ownedByName:
      maxLength: 255
      minLength: 1
      type: string
      description: "Individual recorded as owner.  [ANSWER-NEEDED Q19] Personal names are PII - confirm exposure is permitted, or replace with a group/role reference."
      example: "Jane Doe"
    cyber-inventories-servers_managedByName:
      maxLength: 255
      minLength: 1
      type: string
      description: "Individual recorded as manager.  Same PII consideration as ownedByName."
      example: "John Roe"
    cyber-inventories-servers_businessUnitName:
      maxLength: 255
      minLength: 1
      type: string
      description: "Business unit accountable for the server."
      example: "Consumer Banking Technology"

    cyber-inventories-servers_installedDate:
      maxLength: 10
      minLength: 10
      type: string
      format: date
      description: "Date the server was installed.  ISO 8601, 10 characters."
      example: "2023-06-14"
    cyber-inventories-servers_lastDiscoveredTimestamp:
      maxLength: 32
      minLength: 20
      type: string
      format: date-time
      description: "When discovery last observed this server.  ISO 8601.  A stale value here is the primary signal of lost discovery coverage."
      example: "2026-08-15T04:12:07.114233Z"
    cyber-inventories-servers_warrantyExpirationDate:
      maxLength: 10
      minLength: 10
      type: string
      format: date
      description: "Hardware warranty expiry.  ISO 8601, 10 characters."
      example: "2027-06-13"
    cyber-inventories-servers_decommissionedDate:
      maxLength: 10
      minLength: 10
      type: string
      format: date
      description: "Date the server was decommissioned, if applicable."
      example: "2026-02-28"
    cyber-inventories-servers_lifecycleStageCode:
      type: string
      enum: [planned, build, active, maintenance, endOfLife, decommissioned, unknown]
      description: "Lifecycle stage.  [ANSWER-NEEDED Q18] Confirm enumerated values."
      example: "active"
    cyber-inventories-servers_lifecycleStageDescription:
      maxLength: 100
      minLength: 1
      type: string
      description: "Human-readable partner to lifecycleStageCode."
      example: "Active"

    cyber-inventories-servers_riskRatingCode:
      type: string
      enum: [critical, high, moderate, low, notAssessed]
      description: "Assessed risk rating.  [ANSWER-NEEDED Q18] Confirm against the CMDB risk and security profile table."
      example: "high"
    cyber-inventories-servers_riskRatingDescription:
      maxLength: 100
      minLength: 1
      type: string
      description: "Human-readable partner to riskRatingCode."
      example: "High"
    cyber-inventories-servers_dataClassificationCode:
      type: string
      enum: [public, internal, confidential, restricted, notClassified]
      description: "Classification of data handled by this server.  [ANSWER-NEEDED Q18] Confirm against the Huntington data classification scheme."
      example: "confidential"
    cyber-inventories-servers_dataClassificationDescription:
      maxLength: 100
      minLength: 1
      type: string
      description: "Human-readable partner to dataClassificationCode."
      example: "Confidential"
    cyber-inventories-servers_internetFacingIndicator:
      type: boolean
      default: false
      description: "True when the server is reachable from the public internet."
      example: false
    cyber-inventories-servers_complianceScopeCode:
      type: string
      enum: [pci, sox, glba, ffiec, none, multiple]
      description: "Regulatory scope applying to this server.  [ANSWER-NEEDED Q18] Confirm values and whether multiple scopes require an array instead of a single code."
      example: "sox"
    cyber-inventories-servers_complianceScopeDescription:
      maxLength: 200
      minLength: 1
      type: string
      description: "Human-readable partner to complianceScopeCode."
      example: "Sarbanes-Oxley"
    cyber-inventories-servers_exceptionRequestReference:
      maxLength: 40
      minLength: 1
      type: string
      description: "Reference to an approved security exception covering this server, from the exception management table.  Reference suffix used as this points outside the collection."
      example: "EXC0004412"
    cyber-inventories-servers_exceptionExpirationDate:
      maxLength: 10
      minLength: 10
      type: string
      format: date
      description: "Expiry of the referenced exception.  A temporary exception that has quietly become permanent is a finding in its own right."
      example: "2026-12-31"

    cyber-inventories-servers_criticalVulnerabilityCount:
      type: integer
      minimum: 0
      description: "Count of open critical-severity vulnerabilities."
      example: 0
    cyber-inventories-servers_highVulnerabilityCount:
      type: integer
      minimum: 0
      description: "Count of open high-severity vulnerabilities."
      example: 3
    cyber-inventories-servers_mediumVulnerabilityCount:
      type: integer
      minimum: 0
      description: "Count of open medium-severity vulnerabilities."
      example: 11
    cyber-inventories-servers_lowVulnerabilityCount:
      type: integer
      minimum: 0
      description: "Count of open low-severity vulnerabilities."
      example: 24
    cyber-inventories-servers_lastScannedTimestamp:
      maxLength: 32
      minLength: 20

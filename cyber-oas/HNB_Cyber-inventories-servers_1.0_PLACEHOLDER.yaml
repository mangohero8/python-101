      description: "Fully qualified domain name.  253 characters is the DNS maximum."
      example: "web-prd-01.hban.us"

    cyber-inventories-servers_environmentCode:
      type: string
      enum: [production, disasterRecovery, staging, test, development, unknown]
      description: "Deployment environment.  [ANSWER-NEEDED Q18] Confirm the enumerated values against the actual CMDB u_environment field - these are assumed."
      example: "production"
    cyber-inventories-servers_environmentDescription:
      maxLength: 100
      minLength: 1
      type: string
      description: "Human-readable partner to environmentCode."
      example: "Production"

    cyber-inventories-servers_operationalStatusCode:
      type: string
      enum: [operational, nonOperational, repairInProgress, retired, unknown]
      description: "Operational status.  NOTE: the CMDB column is operational_status; a standalone field named status is FORBIDDEN by the standard, so it is renamed here and paired with a Description.  [ANSWER-NEEDED Q18] Confirm enumerated values."
      example: "operational"
    cyber-inventories-servers_operationalStatusDescription:
      maxLength: 100
      minLength: 1
      type: string
      description: "Human-readable partner to operationalStatusCode."
      example: "Operational"

    cyber-inventories-servers_installStatusCode:
      type: string
      enum: [installed, inStock, onOrder, inMaintenance, pendingInstall, pendingRepair, retired, absent, unknown]
      description: "Install status.  Renamed from the CMDB install_status column for the same reason as operationalStatusCode.  [ANSWER-NEEDED Q18] Confirm enumerated values."
      example: "installed"
    cyber-inventories-servers_installStatusDescription:
      maxLength: 100
      minLength: 1
      type: string
      description: "Human-readable partner to installStatusCode."
      example: "Installed"

    cyber-inventories-servers_virtualIndicator:
      type: boolean
      default: false
      description: "True when the server is virtual rather than physical.  Boolean per the Indicator suffix rule - never Y/N or 1/0."

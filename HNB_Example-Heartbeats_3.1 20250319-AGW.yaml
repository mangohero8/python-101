      properties: { _metadata: { $ref: "#/components/schemas/__common_metadata_Response_Collection" }, payload: { $ref: "#/components/schemas/example-heartbeats_base_summary" } }
    Response_collection_summary_retrieve:
      type: object
      properties: { _metadata: { $ref: "#/components/schemas/__common_metadata_Response_Collection_Retrieve_Summary" }, payload: { $ref: "#/components/schemas/example-heartbeats_base_summary" } }
    #
    # common section END
    ####################
    # /retrieve support
    # This is not needed for alL APIs so can be removed if unnecessary - otherwise modify the properties and example to meet the need
    #
    retrieve_POST_Request:
      required: [_metadata,payload]
      type: object
      properties:
        _metadata:
          $ref: "#/components/schemas/__common_metadata_Request_agw"
        payload:
          required: [example-heartbeats_retrieve]
          type: object
          properties:
            example-heartbeats_retrieve:
              type: array
              description: Fields provided instead of via query parameters (either due to data sensitivity requirements or complex query syntax).  Fields NOT within the parameters are expected to be AND'ed together with the query parameters from the operation AND the complex filters within the parameters aggregate.
              minItems: 1
              maxItems: 1
              items:
                type: object
                properties:
                  parameters:
                    type: array
                    description: "These operators determine how the value of the referenced field is tested.  These tests will be AND'ed with the fields listed in the payload AND the query parameters of the operation."
                    minItems: 0
                    maxItems: 8
                    items:
                      type: object
                      properties:
                        periodReference:
                          $ref: "#/components/schemas/__common_periodReference"
                        correlationId:
                          $ref: "#/components/schemas/__common_correlationId"
                        resourceTimestamp:
                          $ref: "#/components/schemas/__common_resourceTimestamp"
                        observedTimestamp:
                          $ref: "#/components/schemas/__common_observedTimestamp"
                        collectionFields:
                          $ref: "#/components/schemas/retrieve_collectionFields"
                        operator:
                          $ref: "#/components/schemas/__common_operator"
                    example:
                      [
                        {
                          "collectionFields":{
                            "description": "pizz",
                          },
                          "operator": "contains"
                        },
                        {
                          "resourceTimestamp": "2022-08-01T00:00:00.000000+00:00",
                          "operator": "greaterThanOrEqual"
                        },
                      ]
                  collectionFields:
                    $ref: "#/components/schemas/retrieve_collectionFields"
    #
    # Although links is a common field, the examples should be touched up to match the collection
    #
    __common_links:
      type: object
      description: "Includes links to related information to navigate the model.  For a resource, the key may be self, find:correlationId, find:periodReference, collection, or links to other collections.  For a collection or list, the key may be self, first, last, next, prev, collection, etc."
      additionalProperties:
        type: object
        properties:
          href:
            type: string
            description: "The hyperlink that can be followed for additional, related data."
            example: "https://{authority}/hnb-ex-hrtbt/3.1/example-heartbeats"
          templated:
            type: boolean
            description: "templated Indicator - there are fields in the href URL that must be replaced"
            default: true
            example: true
          title:
            type: string
            description: "Indicates the title to be displayed on a human interface"
            example: "GET Example Heartbeats"
      example:
        {
          "self":{"href":"https://{authority}/hnb-ex-hrtbt/3.1/example-heartbeats/{exampleHeartbeatId}?_correlationId={_correlationId}","templated":true,"title":"GET Example Heartbeat"},
          "collection":{"href":"https://{authority}/hnb-ex-hrtbt/3.1/example-heartbeats?_correlationId={_correlationId}","templated":true,"title":"Example Heartbeats Collection"},
          "previous":{"href":"https://{authority}/hnb-ex-hrtbt/3.1/example-heartbeats?_correlationId={_correlationId}&item_offset=1&item_count=10","templated":true,"title":"Example Heartbeats Collection - Previous Page of Results"},
          "next":{"href":"https://{authority}/hnb-ex-hrtbt/3.1/example-heartbeats?_correlationId={_correlationId}&item_offset=11&item_count=10","templated":true,"title":"Example Heartbeats Collection - Next Page of Results"},
          "first":{"href":"https://{authority}/hnb-ex-hrtbt/3.1/example-heartbeats?_correlationId={_correlationId}&item_offset=1&item_count=10","templated":true,"title":"Example Heartbeats Collection - First Page of Results"},
          "last":{"href":"https://{authority}/hnb-ex-hrtbt/3.1/example-heartbeats?_correlationId={_correlationId}&item_offset=91&item_count=10","templated":true,"title":"Example Heartbeats Collection - Last Page of Results"}
        }
    __common_links_Retrieve:
      type: object
      description: "Includes links to related information to navigate the model.  For a resource, the key may be self, find:correlationId, find:periodReference, collection, or links to other collections.  For a collection or list, the key may be self, first, last, next, prev, collection, etc."
      additionalProperties:
        type: object
        properties:
          href:
            type: string
            description: "The hyperlink that can be followed for additional, related data."
            example: "https://{authority}/hnb-ex-hrtbt/3.1/example-heartbeats/retrieve"
          requestBody:
            type: string
            description: "The request body that was passed on the initial request."
            example: "See example below"
          templated:
            type: boolean
            description: "templated Indicator - there are fields in the href URL that must be replaced"
            default: true
            example: true
          title:
            type: string
            description: "Indicates the title to be displayed on a human interface"
            example: "GET Example Heartbeats"
      example:

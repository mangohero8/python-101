openapi: 3.0.3
####################
# info 2025/03/07
#
# PLEASE NOTE THE CHANGES IN THIS VERSION (3.1.0) FROM PREVIOUS VERSIONS!!!
#   - See the below URL for the full list of changes
#      https://huntingtoncloud.sharepoint.com/sites/APIGovernanceStandards/SitePages/FAQ.aspx#changes-to-example-heartbeats_3.0-20240610-(version-3.0.0)-into-example-heartbeats_3.1-20250319-(version-3.1.0)
# Change 'title', 'description', 'version' for your API                                                     
#
# GENERAL NOTES:
# http status 207 needs to be more completely documented as it is not actually an error!
#
# Notes on Example Heartbeats:
# - Example Heartbeats is onboarded to the EQH so it's default (for GET operations especially) is the EQH.
# - Example Heartbeats has implementations on Fuse (both OCP and GCP) as well as the mainframe (CORE) so it is special.
# - The Example Heartbeats applicationSystemFlow is used only to target OCP, GCP, or CORE.  Most application do not need this!
# - The Example Heartbeat API Governance abbreviation is "ex-hrtbt" so the module and scope use this abbreviation.
# 
info:
  contact:
    # Provides a user or potential user of the OAS with information on how to contact the owner of the API with questions
    #  - name: Name of the HNB IT team that owns the OAS
    #  - url - URL to the location where the SoR documents the OAS, sample use cases, description of what is 
    #      required/optional, etc.
    #  - email: Email address for the HNB IT Team taht owns/supports the OAS
    name: API Governance
    url: https://huntingtoncloud.sharepoint.com/sites/APIGovernanceStandards
    email: API.Governance@huntington.com
  # The "title" should start with either "Huntington", "Application", "AppSM", or the name of the Vendor.
  # The "title" should be human friendly casing without dashes.
  title: Huntington Example Heartbeats API
  # The "description" should be, at a minimum, a one-sentence description of the API and its functionality.
  # The "description" can contain markup but useful space is limited by the API Developer Portal.
  description: Check system health by generating a Example Heartbeat, and optionally generate end-to-end events recursively until exampleHeartbeatCounter reaches 0.
  x-hnb.collection:
    # x-hnb:collection will be used by automation processes to be enable translation from the OAS collection 
    # name that includes dashes to a camel case collection
    #   - Set "oas" to the collection name that was approved by Data Modeling / API Governance
    #   - For the "code", remove the dashes (-) from the "oas" name and make the next character after the dash
    #        upper case
    #   - resourceDefinition - Identifies the object that defines the main colleciton of the OAS
   - oas: "example-heartbeats"
   - code: "exampleHeartbeats"
   - resourceDefinition: 
      $ref: "#/components/schemas/example-heartbeats_RESOURCE"
  # The "version" has 3 components (major, minor, point) but only the first 2 are carried in the API Name and
  #  implementation module.
  version: 3.1.0
  # Set the x-hnb.scopes to the combined list of scopes for all operations - this should be overridden within each
  #  operation.
  # - This list is the list of scopes that the API accepts - not what is done with them (that's in the proxy)
  x-hnb.scopes: ["ex-hrtbt:read","ex-hrtbt:write","eeh-eqh:write"]
  
  x-hnb.target:
    # x.hnb.target will define where the target implementation will be executing
    # - default
    #        Set to the implementation-specific DEFAULT location which will be tested in the proxy (GCP,OCP
    #            ,CORE,EQH,etc.).
    #       This CAN be overridden within each operation.
    #       Valid values are:
    #         - EQH -  indicates the default for GET operations is the EQH.
    #         - CORE - implies mainframe
    #         - OCP - implies Fuse-on-OCP
    #         - GCP - imples Fuse-Cloud-GCP
    #       Please ask API Governance for legal values if there is a question.
    # - <environment> - Represents the different environments at Huntington (dv, in, qa, st, tr, pd)
    #   - This section will be used to identify the URL that the AGW should route the request to.  Once
    #       automation is done and we have standard URLs that are predictible, these will be removed from the
    #       OAS and the outomation processes will be able to derrive the values for 'audience' and 'endpoint'
    - default: EQH
    - dv:
        audience: https://hnb-ex-hrtbt-3-1-qcoeunjjga-uc.a.run.app
        endpoint: https://hnb-ex-hrtbt-3-1-qcoeunjjga-uc.a.run.app/hnb-ex-hrtbt/3.1
    - in:
        audience: https://hnb-ex-hrtbt-3-1-nmqaifcxea-uc.a.run.app
        endpoint: https://hnb-ex-hrtbt-3-1-nmqaifcxea-uc.a.run.app/hnb-ex-hrtbt/3.1
    - qa:
        audience: https://hnb-ex-hrtbt-3-1-fvjn75rmra-uc.a.run.app
        endpoint: https://hnb-ex-hrtbt-3-1-fvjn75rmra-uc.a.run.app/hnb-ex-hrtbt/3.1
    - st:
        audience: https://hnb-ex-hrtbt-3-1-k5u3353ltq-uc.a.run.app
        endpoint: https://hnb-ex-hrtbt-3-1-k5u3353ltq-uc.a.run.app/hnb-ex-hrtbt/3.1
    - tr:
        audience: https://hnb-ex-hrtbt-3-1-qwertywysiwyg-uc.a.run.app
        endpoint: https://hnb-ex-hrtbt-3-1-qwertywysiwyg-uc.a.run.app/hnb-ex-hrtbt/3.1
    - pd:
        audience: https://hnb-ex-hrtbt-3-1-b7uw4bn2aa-uc.a.run.app
        endpoint: https://hnb-ex-hrtbt-3-1-b7uw4bn2aa-uc.a.run.app/hnb-ex-hrtbt/3.1
  # Set x-hnb:cmdbCorrelationId to the Correlation ID from CMDB for HNB IT Team that owns the OAS
  x-hnb.cmdbCorrelationId: "1234567"
  # Set x-hnb:cmdbName to the Name from CMDB that aligns with x-hnb:cmdbCorrelationId
  x-hnb.cmdbName: "API Governance"
  # Set x-hnb:ownerEmail to the email address of the HNB IT Team that owns the OAS
  x-hnb.ownerEmail: API.Governance@huntington.com
  # Set x-hnb:approverEmail to the email address of the HNB IT Team approving AGW Access to this OAS
  x-hnb.approverEmail: API.Governance@huntington.com
  # Set x-hnb:idempotency to 'Standard' to identify that the AGW Proxy for this OAS will enable 'Standard' Idempotency Defense to ensure methods that are not 
  # usually idempotent (POST/PATCH) are not unintentionally executed more than once.  Set this to 'Disabled' if this is not needed.  If this is not 'Disabled' 
  # then idempotencyKeyAPI is expected to be populated by the API requestor.
  x-hnb.idempotency: 'Standard'
  # Set x-hnb:proxyPrefix based on the 'Classification' of the OAS on the API Deployment Summary
  #  If it is HNB, App, or AppSM, set it to  those values (HNB, App, or AppSM)
  #  If it is Vendor, set it  to the 'Sub Classification' value on the API Deployment Summary (this is the vendor's name)
  x-hnb.proxyPrefix: 'HNB'
  x-hnb.quota:
    # The quota defines the number of API calls that can be made within a certain time interval.  There are 3
    #   classifications (Bronze, Silver, Gold) and the API Owner will define the limits they allow within each
    #   of the classifications.  These classifications will need defined separately for Non-Production (NP) 
    #    and Production (PD) environments.
    #
    # - count - Number of API calls that can be made in the interval
    # - interval - number of time periods in which quotas are calculated, is used along with the timeUnit
    # - timeUnit - unit of time applicable to the quota (seconds, minutes, hours)
    - environment: np
      values: 
      - type: Bronze
        count: 10
        interval: 1
        timeUnit: minute
      - type: Silver
        count: 100
        interval: 1
        timeUnit: minute
      - type: Gold
        count: 1000
        interval: 1
        timeUnit: minute
    - environment: pd
      values: 
      - type: Bronze
        count: 500
        interval: 1
        timeUnit: minute
      - type: Silver
        count: 5000
        interval: 1
        timeUnit: minute
      - type: Gold
        count: 10000
        interval: 1
        timeUnit: minute
  #
  # info END
  ####################
tags:
  # The "tags" section defines each of the tag groupings for the operations withih the OAS along with a description
  #  that will be shown in the rendered OAS
  - name: Example Heartbeats
    description: "Operations on the Collection"
  - name: Example Heartbeat
    description: "Operations on a specific Resource"
  - name: Example Heartbeat (set)
    description: "Operations on a set of Resources"
  - name:  Example Heartbeat Event
    description: "Operation to show the EEH topic structure"
  - name: Ping
    description: "Operations to test availability"
  #
  # tags END
  ####################
servers:
  ####################
  # servers
  #
  # List is common so no need to add or alter URLs - OK to remove the External and Fintech URLs if API is intended to be Internal ONLY.
  # Change 'module', 'version' options and (optional) remove unnecessary url sections
  #
  - url: "https://localhost:8080/{module}/{version}"
    description: Execute locally
    variables: { module:{ enum: [hnb-ex-hrtbt], default: hnb-ex-hrtbt }, version:{ enum: ["3.1"], default: "3.1"} }
  - url: "https://{mock}-{env}-int.hban.us/{module}/{version}"
    description: (DV, IN, QA, ST, TR) Internal AGW
    variables: { module:{ enum: [hnb-ex-hrtbt], default: hnb-ex-hrtbt }, version:{ enum: ["3.1"], default: "3.1"}, 
    mock:{ enum: [mock-agw,agw], default: mock-agw }, env:{ enum: [dv,in,qa,st,tr], default: in } }
  - url: "https://{mock}-{env}-ext{mtls}.huntington.com/{module}/{version}"
    description: (IN, QA, ST, TR) External (Colleague/Partner) AGW
    variables: { module:{ enum: [hnb-ex-hrtbt], default: hnb-ex-hrtbt }, version:{ enum: ["3.1"], default: "3.1"}, 
    mock:{ enum: [mock-agw,agw], default: mock-agw }, env:{ enum: [dv,in,qa,st,tr], default: in },
     mtls:{ enum: ["","-mtls"], default: "" } }
  - url: "https://{mock}-{env}.huntington.com/{module}/{version}"
    description: (IN, QA, ST, TR) External (Customer/Fintech) AGW
    variables: { module:{ enum: [hnb-ex-hrtbt], default: hnb-ex-hrtbt }, version:{  enum: ["3.1"], default: "3.1"}, 
    mock:{ enum: [mock-agw,agw], default: mock-agw }, env:{ enum: [in,qa,st,tr], default: in } }
  - url: "https://{mock}-int.hban.us/{module}/{version}"
    description: PD (Production) Internal AGW
    variables: { module:{ enum: [hnb-ex-hrtbt], default: hnb-ex-hrtbt }, version:{  enum: ["3.1"], default: "3.1"}, 
    mock:{ enum: [mock-agw,agw], default: mock-agw }, env:{ enum: [pd], default: pd } }
  - url: "https://{mock}-ext{mtls}.huntington.com/{module}/{version}"
    description: PD (Production) External (Colleague/Partner) AGW
    variables: { module:{ enum: [hnb-ex-hrtbt], default: hnb-ex-hrtbt }, version:{ enum: ["3.1"], default: "3.1"}, 
    mock:{ enum: [mock-agw,agw], default: mock-agw }, env:{ enum: [pd], default: pd }, mtls:{ enum: ["","-mtls"], default: "" } }
  - url: "https://{mock}.huntington.com/{module}/{version}"
    description: PD (Production) External (Customer/Fintech) AGW
    variables: { module:{ enum: [hnb-ex-hrtbt], default: hnb-ex-hrtbt }, version:{  enum: ["3.1"], default: "3.1"}, 
    mock:{ enum: [mock-agw,agw], default: mock-agw }, env:{ enum: [pd], default: pd } }
  #
  # servers END
  ####################
paths:
  # paths
  # Remove unnecessary paths and change paths to match <collection>/<resourceId>.
  # Change 'tags' and 'summary' to meet needs consistent with the naming conventions.
  # Add list of API-specific parameters to GET operations as appropriate.
  # Any EQH-bound API needs to support a "/summary" limiter and a description field (included in the /summary as well as the RESOURCE)
  # Leave __common_ parameters for GET operations if you are onboarding to the EQH or doing a GCP PRI implementation.  Otherwise, you may remove those parameters your implementation will not support.
  # Remove the applicationSystemFlow query parameter unless the API specifically requires it (needs approval).
  # Change responses to meet needs - pull from full status list in post operation against the collection (not the post /retrieve) below.
  #   The sample responses list (on the post operation) contains the full list of responses available for any Huntington API - this list needs to be trimmed/copied where appropriate.
  #   If there are service-specific needs, edit this list and/or copy these responses to other operations.
  # The POST /retrieve are essentially GET operations with parameters that need to be encrypted, or complex query patterns.
  #
  # DO NOT change the hierarchy of the objects in the responses.
  # DO add/subtract query parameters as needed on the collection operations.
  # The list of query parameters (for GET operations) in Heartbeats are supported by the EQH for all APIs.
  #
  /example-heartbeats/summary:
    get:
      operationId: getExampleHeartbeatsSummary
      tags: ["Example Heartbeats"]
      summary: "Retrieve a list of (aka search for) Example Heartbeats with brief details"
      description: |
       The list of fields returned include the resource identifier (exampleHeartbeatId) and description.<br/><br/>A GET operation with a limiter (i.e. /summary) to the collection (/example-heartbeats without specifying a exampleHeartbeatId) is effectively a search against the collection and will return a pre-determined subset of fields.  See GET /example-heartbeats for additional details.  Note that this type of GET operation will return a 200 even if no resources are found that match the query.
       <br/><br/>Every collection should have a /summary operation with a subset of fields (including description!) to permit retrieval of lists of resources for presentation or selection without requiring the entire payload to be retrieved.
        
        | HTTP Status | severity | statusCode (see [API Status Codes](https://huntingtoncloud.sharepoint.com/:x:/s/APIGovernanceStandards/ETPtQcPAXz5BvZng8RcEX8EBe27aSlfVljFyBBUUvv-qaQ?e=vOM9E5) document for more detail) |  Use Case when returned           |
        |-----------|----------|------------|-----------------------------------|
        | 200       | info     | HNB+0004   | No Example Heartbeat Records Found       |
      x-hnb.scopes: ["ex-hrtbt:read"]
      # Security - change the above line to include your appropriate scopes from the master list
      # This list of parameters are the common parameters expected by the EQH on a GET (search) /summary operation.  Other implementations may use a subset.
      parameters:
        - $ref: "#/components/parameters/description_Query"
        - $ref: "#/components/parameters/originatingReference_Query"
        - $ref: "#/components/parameters/__common_periodReference_Query"
        - $ref: "#/components/parameters/__common_correlationId_Query"
        - $ref: "#/components/parameters/__common_resourceTimestamp_Query"
        - $ref: "#/components/parameters/__common_observedTimestamp_Query"
        - $ref: "#/components/parameters/__common_sort_by_Query"
        - $ref: "#/components/parameters/__common_item_offset_Query"
        - $ref: "#/components/parameters/__common_result_next_Query"
        - $ref: "#/components/parameters/__common_item_count_Query"
        - $ref: "#/components/parameters/__common_include_total_results_Query"
      responses:
        '200':
          $ref: "#/components/responses/HTTP_200_collection_summary"
        '400':
          $ref: "#/components/responses/__common_HTTP_400"
        '401':
          $ref: "#/components/responses/__common_HTTP_401"
        '403':
          $ref: "#/components/responses/__common_HTTP_403"
        '500':
          $ref: "#/components/responses/__common_HTTP_500"
        default:
          $ref: "#/components/responses/__common_HTTP_default"
  /example-heartbeats:
    get:
      operationId: getExampleHeartbeatsCollection
      tags: ["Example Heartbeats"]
      summary: "Retrieve a list of (aka search for) Example Heartbeats"
      description: |
       Performs a search against the collection and returns the list of resources with all of its fields (unless a subset is specified in the "field_list" query parameter).<br/></br>A GET operation to the collection (/example-heartbeats without specifying a exampleHeartbeatId) is effectively a search against the collection.  Note that a properly formed search may yield zero resources resulting in an HTTP status of 200 (OK) even though nothing was found to match the search criteria.  By default, the EQH will enable query parameters for any of the fields in the collection.  If the OAS specifies any query parameters, they may indicate **required** parameters.
        
        | HTTP Status | severity | statusCode (see [API Status Codes](https://huntingtoncloud.sharepoint.com/:x:/s/APIGovernanceStandards/ETPtQcPAXz5BvZng8RcEX8EBe27aSlfVljFyBBUUvv-qaQ?e=vOM9E5) document for more detail) |  Use Case when returned           |
        |-----------|----------|------------|-----------------------------------|
        | 200       | info     | HNB+0004   | No Example Heartbeat Records Found       |
      x-hnb.scopes: ["ex-hrtbt:read"]
      # Security - change the above line to include your appropriate scopes from the master list
      parameters:
        # This list of parameters are the common parameters expected by the EQH on a GET (search) operation.  Other implementations may use a subset.
        # There should ALSO be API-specific query parameters for all the fields within the API (the EQH will automatically enable all of them as well as min/max for each).
        # Insert API-specific query parameters here - remember that parameters must be a subset of the fields within an API (with or without _min/_max suffices).
        - $ref: "#/components/parameters/description_Query"
        - $ref: "#/components/parameters/originatingReference_Query"
        - $ref: "#/components/parameters/show_originator_Query"
        - $ref: "#/components/parameters/show_requestor_Query"
        - $ref: "#/components/parameters/__common_periodReference_Query"
        - $ref: "#/components/parameters/__common_correlationId_Query"
        - $ref: "#/components/parameters/__common_resourceTimestamp_Query"
        - $ref: "#/components/parameters/__common_observedTimestamp_Query"
        - $ref: "#/components/parameters/__common_sort_by_Query"
        - $ref: "#/components/parameters/__common_item_offset_Query"
        - $ref: "#/components/parameters/__common_result_next_Query"
        - $ref: "#/components/parameters/__common_item_count_Query"
        - $ref: "#/components/parameters/__common_include_total_results_Query"
        - $ref: "#/components/parameters/__common_count_only_Query"
        - $ref: "#/components/parameters/__common_include_metadata_Query"
        - $ref: "#/components/parameters/__common_field_list_Query"
        - $ref: "#/components/parameters/__common_expand_resources_Query"
      responses:
        '200':
          $ref: "#/components/responses/HTTP_200_collection"
        '400':
          $ref: "#/components/responses/__common_HTTP_400"
        '401':
          $ref: "#/components/responses/__common_HTTP_401"
        '403':
          $ref: "#/components/responses/__common_HTTP_403"
        '500':
          $ref: "#/components/responses/__common_HTTP_500"
        default:
          $ref: "#/components/responses/__common_HTTP_default"
    post:
      operationId: postExampleHeartbeats
      tags: ["Example Heartbeats"]
      summary: "Create a Example Heartbeat, and optionally generate an event"
      description: |  
        This operation will cause a Example Heartbeat to be created and returned to the caller will all of the resource fields filled in.  Due to the nature of this API, only requests where \"generateMessageIndicator\":true is set will cause the created Example Heartbeat to be persisted.
        <br/><br/>A POST operation will normally create a new resource and return that information to the caller.  In many implementations (not Example Heartbeats), a repeated POST with the same information MAY return the same resource identifier (i.e. the data maps to an existing resource).
        <br/><br/>Thus it is NOT required that a new resource be created (http status 201) as the result of a POST.  In most implementations, a POST will create a new resource (as is done in Example Heartbeats).  However, a POST ~/customers repeated multiple times might yield the same resource (thus http status 200) as the servicing implementation can map it to an existing customer while a POST ~/pendingtransactions would ALWAYS create a new transaction.
        <br/><br/>This operation accepts an ARRAY of resources as input and may result in different status for each entry.  Any errors identified will be reported for the individual record in the response status array and called out by entry (starting at 0 for the 1st entry).
        <br/><br/>If all entries are processed successfully, the return status will be 200 (or 204 if include_response=false is passed).  If any entry fails then the return status will be 207 and the caller will need to check the statuses and 207-specific content (include_response=false is IGNORED if there are any failures).  Also note, as this is a POST, any successfully POSTed records will have a unique identifier added to the response for that entry.
        <br/><br/>This operation lists ALL POSSIBLE APPROVED HTTP status codes!  This list should be trimmed to remove those that the Implementation does not use. Similarly, these can be copied to other operations if documentation specificity is desired.
        NOTE THAT THE EQH HAS IA SPECIFIC SET OF STATUS CODES IT WILL RETURN ON GET OPERATIONS.  Note that some statuses - like 'Service is Working' may only be returned if another status or payload is not clear (for example a GET ~/\<collection> that returns 0 results may include this status).
      
        | HTTP Status | severity | statusCode (see [API Status Codes](https://huntingtoncloud.sharepoint.com/:x:/s/APIGovernanceStandards/ETPtQcPAXz5BvZng8RcEX8EBe27aSlfVljFyBBUUvv-qaQ?e=vOM9E5) document for more detail) |  Use Case when returned           |
        |-----------|----------|------------|-----------------------------------|
        | 400       | error    | HNB-0014   | Required field not on request (originatingReference, originatingTimestamp)       |
      x-hnb.scopes: ["ex-hrtbt:write"]
      # Security - change the above line to include your appropriate scopes from the master list at the top of this OAS.
      x-hnb.target.override:
        # The x-hnb.target is designed to handle mainframe (CORE), OCP, and GCP.  Remove those that are not germane to your API.
        # If your API is not deployed in multiple different technology stacks, then the x-hnb.target.override and the applicationSystemFlow parameter are not required and should be removed.
        - default: CORE
        - condition:
          operator: equals
          applicationSystemFlow: ocp
          target: OCP
        - condition:
          operator: equals
          applicationSystemFlow: gcp
          target: GCP
        - condition:
          operator: equals
          applicationSystemFlow: core
          target: CORE
      parameters:
        # This list of parameters are the only parameters expected on a POST operation to create a resource.
        - $ref: "#/components/parameters/show_originator_Query"
        - $ref: "#/components/parameters/show_requestor_Query"
        - $ref: "#/components/parameters/__common_include_response_Query"
        - $ref: "#/components/parameters/__common_include_metadata_Query"
        - $ref: "#/components/parameters/__common_applicationSystemFlow_Query"
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/example-heartbeats_POST_Request" } } } }
      responses:
        # This is the superset of ALL possible HTTP statuses supported by Huntington AGW and backend implementations - some implementations may not support all of these.
        # NOTE:  Not all of these are appropriate for POST or PUT!!  For example, 404 is not valid for a POST but could be valid for a PUT.
        '200':
          $ref: "#/components/responses/HTTP_200"
        '201':
          $ref: "#/components/responses/HTTP_201"
        '202':
          $ref: "#/components/responses/__common_HTTP_202"
        '204':
          $ref: "#/components/responses/__common_HTTP_204"
        '207':
          $ref: "#/components/responses/__common_HTTP_207"
        '301':
          $ref: "#/components/responses/__common_HTTP_301"
        '302':
          $ref: "#/components/responses/__common_HTTP_302"
        '303':
          $ref: "#/components/responses/__common_HTTP_303"
        '306':
          $ref: "#/components/responses/__common_HTTP_306"
        '307':
          $ref: "#/components/responses/__common_HTTP_307"
        '400':
          $ref: "#/components/responses/__common_HTTP_400"
        '401':
          $ref: "#/components/responses/__common_HTTP_401"
        '403':
          $ref: "#/components/responses/__common_HTTP_403"
        '404':
          $ref: "#/components/responses/__common_HTTP_404"
        '405':
          $ref: "#/components/responses/__common_HTTP_405"
        '406':
          $ref: "#/components/responses/__common_HTTP_406"
        '409':
          $ref: "#/components/responses/__common_HTTP_409"
        '415':
          $ref: "#/components/responses/__common_HTTP_415"
        '422':
          $ref: "#/components/responses/__common_HTTP_422"
        '500':
          $ref: "#/components/responses/__common_HTTP_500"
        '501':
          $ref: "#/components/responses/__common_HTTP_501"
        '502':
          $ref: "#/components/responses/__common_HTTP_502"
        '503':
          $ref: "#/components/responses/__common_HTTP_503"
        '504':
          $ref: "#/components/responses/__common_HTTP_504"
        default:
          $ref: "#/components/responses/__common_HTTP_default"
    patch:
      operationId: patchExampleHeartbeatsSet
      tags: ["Example Heartbeat (set)"]
      summary: "Update a group of Example Heartbeats"
      description:  |
        This works the same as a PATCH on each individual resource within the payload.

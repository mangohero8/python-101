    __common_applicationId:
      description: "Application identifier is the registered CMDB Correlation ID.  In most cases, this is synonymous with applicationSystem which is maintained for backwards compatiblity."
      type: string
      maxLength: 30
      minLength: 1
      example: "12345"
    __common_applicationSystem:
      description: "Application name.  If this field is ALL numbers then it is the registered CMDB Correlation ID.  If not, it is the name as registered with CMDS for that CMDB application."
      type: string
      maxLength: 30
      minLength: 1
      example: "AGW"
    __common_applicationSystemReference:
      type: string
      description: "The value of the unique identifier in the cross-referenced system"
      example: "092834-098-BH"
    __common_changeset:
      type: array
      items:
        type: string
        description: "Array of \"<field>=<oldvalue>\" elements indicating the old values of any field that has changed since the previous update.  Note: Values containing double quotes must be escaped and any other encoding must be done to ensure a valid JSON string."
        example: "description=The \"Olde\" Description"
    __common_correlationId:
      maxLength: 36
      minLength: 1
      type: string
      description: "Unique Id for the initiating request generated by the caller - ideally a GUID/UUID - but any opaque string.  This may be used by subsequent calls (or log entries) to tie a chain of processing together."
      example: "8a321c5e-4ac7-45da-824d-e0b3f5b9a416"
    __common_sessionId:
      type: string
      description: "Unique Id for the initiating request generated by the caller - ideally a GUID/UUID - but any opaque string.  The prefix _ is used on a GET or DELETE operation (that does not have a payload) to assign the correlationId for this request."
      example: "8a321c5e-4ac7-45da-824d-e0b3f5b9a416"
    __common_idempotencyKeyResource:
      type: string
      description: "This is the idempotency key for a specific resource within payload of the event - used to identify duplicate events.  The idempotencyKeyResource will be set by the publisher for each individual event.
        
        Format: <Source System Identifier>:<Unique Identifier>:<incrementor based on sequence of the event>      _
        
        
        If publishing via the Events API,
          - The <Source System Identifier> will be the apiKey of the SOURCE application from where the request originated.
          - The <Unique Identifier> will be the same value that was placed in the idempotencyKeyAPI in the header of the API call. The same value will be used for every event in the payload.  If the OAS does not require Idempotency (meaning it has not been implemented it in the AGW for this OAS) and the idempotencyKeyAPI is not populated the publisher will be responsible to generate the <Unique Identifier> (preferably a GUID) that would be used when publishing the event to the EEH
          - The incrementor is the sequential value for each event in the payload, starting at 1.
          - NOTE: When making the API call, you should populate the idempotencyKeyAPI with the same <Source System Identifier>:<Unique Identifier> values.

        If NOT publishing via the Events API,
        - The <Source System Identifier> will be the CMDBID of the publisher.  If the publisher would like to add a qualifier to identify their process more granularly, they can (ex. 123456-job5678).
        - The <Unique Identifier> will be a globally unique value across the bank, preferably a GUID.  Create a separate value for each event.
        - Every record is considered an individual event, so the incrementor should always be set to 1.
 
        An Example containing all three components would be 'F3gA3cVE7SxlcmfQgzD24VIlEYBoRnO7C3FHW64hFImc491s:68425e943052d58a777b82643ad79f8f6afa90bd361415e325fd0eeba657b92c:1'"
      example: "F3gA3cVE7SxlcmfQgzD24VIlEYBoRnO7C3FHW64hFImc491s:68425e943052d58a777b82643ad79f8f6afa90bd361415e325fd0eeba657b92c:1"
    __common_messageHash:
      type: string
      description: "Hash of the response message that can be used to validate the request was not modified between the requesting application and the receiving application"
      example: "23274e943052d58a777b82643ad79f8f6afa90bd361415e628fd0eeba111b16c"
    __common_crossReferences:
      type: object
      description: "Indexed by the name of the system being cross-referenced and provides a known external identifier for a particular resource.  This can be used to track that a resource was created on behalf of an external system.  The fieldname is the applicationSystem value."
      additionalProperties:
        type: object
        properties:
          identifierName:
            $ref: "#/components/schemas/__common_identifierName"
          applicationSystemReference:
            $ref: "#/components/schemas/__common_applicationSystemReference"
      example:
        {
          "MAX":{"identifierName":"maxIdentifier","applicationSystemReference":"092834-098-BH"},
          "1234567":{"identifierName":"accntPermId","applicationSystemReference":"29083433"},
          "AFS":{"identifierName":"afsAccntNum","applicationSystemReference":"A9I392"}
        }
    __common_identifierName:
      type: string
      description: "The name of the unique identifier in the cross-referenced system"
      example: "maxLoginId"
    __common_item_count:
      type: integer
      minimum: 1
      default: 200
      description: "Number of resources to return starting at item_offset"
      example: 1
    __common_item_offset:
      type: integer
      minimum: 1
      default: 1
      description: "Offset of first resource (start at 1) in the overall resources available for this query.  This CANNOT be used with result_next"
      example: 201
    __common_result_next:
      type: string
      description: "Opague string sent from the SoR that would be used in a subsequent request to retrieve the next page of data.  This CANNOT be used with item_offset"
      example: "dXNlcjpXMDdRQ1JQQTQ="
    __common_loginId:
      type: string
      description: "Indicates the login Id.  For loginType=colleague, this is the hbidnumber.  Other values of loginType have their specific formats."
      example: "hbidnumber"
    __common_loginType:
      type: string
      description: "Indicates the type of loginId.  Nominally 'colleague' or 'customer' but can also contain the name of the system referenced with the loginid"
      example: colleague
    __common_observedTimestamp:
      maxLength: 32
      minLength: 1
      type: string
      description: "Timestamp reflecting when the System of Record observed the change in the resource - the time of the actual event that caused the creation/change to this resource.  This field is optional."
      example: "2020-04-24T20:10:30.349833Z"
    __common_operationTimestamp:
      type: string
      description: "Indicates the operation Timestamp.  ISO 8601 timestamp to microseconds accuracy."
      example: "2020-11-23T13:57:45.519276+05:00"
    __common_operator:
      type: string
      description: "Operator used to test value of field"
      example: "greaterThanOrEqual"
      enum: ['lessThan','lessThanOrEqual','equal','notEqual','greaterThanOrEqual','greaterThan','beginsWith','endsWith','contains', 'doesNotContain']
    __common_paging:
      type: object
      description: "Returned in collection responses: There are two distinct types of paging responses (returned from the EQH - note that SoR implementations may vary) - small datasets and large datasets.  For small datasets of 1000 records or fewer, the fields item_offset and total_results are returned and assist in navigation through that subset of the collection (note that if the collection changes between calls or other query parameters are altered, the paging may return unexpected or disjoint results).  For large datasets greater than 1000 records, no information is available on the full size of the dataset so only item_count is returned - next/prev options can be found in the _metadata.links for the collection."
      properties:
        item_offset:
          $ref: "#/components/schemas/__common_item_offset"
        result_next:
          $ref: "#/components/schemas/__common_result_next"
        item_count:
          $ref: "#/components/schemas/__common_item_count"
        total_results:
          $ref: "#/components/schemas/__common_total_results"
    __common_periodReference:
      minLength: 1
      maxLength: 36
      type: string
      description: "Identifies the system of record processing period for this entry. For example, the bank processing data when this resource was created or updated.  This field is required within a resource."
      example: "20250312-10:00 or 20250312-JobName"
    __common_resourceOwnerReference:
      type: object
      description: "Useful to identify colleagues (or other individuals) that may have specific ownership of this resource within the collection"
      properties:
        loginType:
          $ref: "#/components/schemas/__common_loginType"
        loginId:
          $ref: "#/components/schemas/__common_loginId"
        crossReferences:
          $ref: "#/components/schemas/__common_crossReferences"
    __common_resourceTimestamp:
      maxLength: 32
      minLength: 1
      type: string
      description: "Timestamp reflecting the last update of the resource - when the System of Record recorded the change.  While this field is not mandatory, it is highly recommended as it plays a critical role in determining the chronological order of events for downstream consumers. Accurate and consistent population of this field ensures reliable event sequencing, especially in distributed systems where message arrival order cannot be guaranteed."
      example: "2020-04-24T20:11:31.349833Z"
    __common_return_history:
      type: boolean
      description: "When fetching a particular resource, this parameter allows retrieving all changes to this resource as recorded by the EQH."
      default: false
      example: false
    __common_statuses:
      type: array
      description: "An array of values intended to provide additional information on the request including errors or other warnings - note that the example 'Service is Working' may only be relevant if an explicit status is required."
      maxItems: 10
      items:
        type: object
        properties:
          severity:
            type: string
            description: "The severity of the statusCode provided"
            example: "error"
            enum: [alert,critical,error,warning,info,debug]
          statusCode:
            maxLength: 8
            minLength: 8
            type: string
            description: "The resource server generated status code indicating any information or problems with the request"
            example: "HNB-9999"
          statusDescription:
            maxLength: 256
            minLength: 1
            type: string
            description: "Indicates the status short description (as registered)"
            example: "Value Limit Exceeded"
          reason:
            maxLength: 1024
            minLength: 1
            type: string
            description: "Application provided additional amplifying text – which may include a traceback"
            example: "Internal error with field 'x'"
      example:
        [
          {
            "severity": "info",
            "statusCode": "HNB+0001",
            "statusDescription": "Service is Working",
            "reason": "Service is Working"
          }
        ]
    __common_total_results:
      type: integer
      minimum: 1
      description: "The total number of results (records) for the query"
      example: 1025
    __common_tracking:
      type: array
      items:
        type: object
        description: "Tracking details for all changes to the resource since creation"
        properties:
          operation:
            $ref: "#/components/schemas/__common_verb"  
          operationTimestamp:
            $ref: "#/components/schemas/__common_operationTimestamp"
          correlationId:
            $ref: "#/components/schemas/__common_correlationId"
          loginType:
            $ref: "#/components/schemas/__common_loginType"
          loginId:
            $ref: "#/components/schemas/__common_loginId"
          resourceModifierReference:
            type: string
            description: "Custom reference to the screen/application/channel that requested modification of the resource"
            example: DF22
          changeset:
            $ref: "#/components/schemas/__common_changeset"
    __common_ping_Response:
      type: object
      properties:
        _metadata:
          $ref: "#/components/schemas/__common_metadata_Response_agw"
      example:
        {
          "_metadata": {
            "correlationId": "8a321c5e-4ac7-45da-824d-e0b3f5b9a416",
            "sessionId": "9a432c6e-5ac8-56da-834d-e0b4f6b0a527",
            "statuses": [

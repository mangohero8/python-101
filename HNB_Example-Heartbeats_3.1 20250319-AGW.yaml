      minLength: 1
      type: string
      description: "Timestamp as recorded when the Example Heartbeat was processed by the service.  ISO 8601 timestamp to microseconds accuracy."
      example: "2020-04-24T20:11:32.123333Z"
    example-heartbeats_generateMessageIndicator:
      type: boolean
      description: "Whether Example Heartbeats should be delivered to the Event Hub"
      default: false
      example: true
    example-heartbeats_exampleHeartbeatCounter:
      maximum: 999
      minimum: 0
      type: integer
      description: "Number of example-heartbeats to generate in a recursive cycle - a processor (EEH listener) is listening for Example Heartbeats where exampleHeartbeatCounter>0 and will create a new Example Heartbeat at that time"
      example: 3
    example-heartbeats_heartRateVariability:
      type: string
      description: "Measures the variation in time between consecutive heartbeats calculated in milliseconds.  This comes into play when exampleHeartbeatCounter is > 1 and would be calculated by the 'Example Heartbeats Listener' that is picking up events that have exampleHeartbeatCounter > 1, decrement the count by 1 and calling POST /example-heartbeats (This process would repeat until exampleHeartbeatCounter = 1)"
      # x-hnb.periodendsReconciliation - Identifies that the field will be used as part of the Period Ends Reconciliation ensuring that all records from the source reach the target.  Including this attribute on a field in the OAS signals to downstream systems (ex. EEH, EQH, etc.) that an action needs to be taken on this fieldfor each event in the period to complete reconciliation.
      #   Valid options are:
      #      - sum - This field should be summed across the period and used in the reconciliation process by comparing the total for the period to the value that is passed in the Period Ends event at the end of the period.
      x-hnb.periodendsReconciliation:
        - sum
      example: "125.34"
    example-heartbeats_heartRateVariabilityThreshold:
      type: string
      description: "Specifies the heartRateVariability maximum value that would result in an alert being sent when exceeded (in milliseconds)"
      example: "175.50"
    example-heartbeats_requestor_requestingReference:
      type: string
      description: "Self-provided label of the requesting application or processor - may differ from the originatingReference if created in response to an initial Example Heartbeat"
      # x-hnb.eeh - Identifies what should be done to the data in this field when it is published to the EEH
      #   Valid options are:
      #      - obfuscate:encrypt
      #      - obfuscate:tokenize
      #      - obfuscate:truncate
      x-hnb.eeh:
        - obfuscate.encrypt
      # x-hnb.logging - Identifies what should be done to the data in this field when it is logged
      #   Valid options are:
      #      - redact
      #      - truncate
      x-hnb.logging:
        - truncate
      example: "Enterprise Event Hub"
    example-heartbeats_requestor_requestingTimestamp:
      maxLength: 32
      minLength: 1
      type: string
      description: "Timestamp when the requestor delivered (or relayed if not the originator) this iteration of the Example Heartbeat.  ISO 8601 timestamp to microseconds accuracy."
      example: "2020-04-24T20:13:34.345323+05:00"

    ###############################################################
    #
    # collection specific fields END

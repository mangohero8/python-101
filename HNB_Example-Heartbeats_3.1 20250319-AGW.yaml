  /eeh-events:
    # /eeh-events: Change ONLY the name of the operationId, tags, summary, description, and x-hnb:scopes here.
    post:
      operationId: postExampleHeartbeatEvent
      tags: ["Example Heartbeat Event"]
      summary: "Send a new  Example Heartbeat to the EEH"
      description: |  
        This operation will cause a EEH Event to be created and returned to the identies the Example Heartbeats structure that will be published to the EEH Event by the SoR and what subscribers to that topic would recieve in the subscription.
        
        Some **KEY** items to note When executing this operation:
        - It is supported by the following servers:
          - (DV, IN, QA, ST, TR) Internal AGW
          - (IN, QA, ST, TR) External (Colleague/Partner) AGW
          - PD (Production) Internal AGW
          - PD (Production) External (Colleague/Partner) AGW

        | HTTP Status | severity | statusCode (see [API Status Codes](https://huntingtoncloud.sharepoint.com/:x:/s/APIGovernanceStandards/ETPtQcPAXz5BvZng8RcEX8EBe27aSlfVljFyBBUUvv-qaQ?e=vOM9E5) document for more detail) |  Use Case when returned           |
        |-----------|----------|------------|-----------------------------------|
        |           |          |            |                                   |
      x-hnb.scopes: ["eeh-eqh:write","ex-hrtbt:write"]
      # Security - change the above line to include your appropriate scopes from the master list at the top of this OAS.
      parameters:
        - $ref: "#/components/parameters/__common_include_response_Query"
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/eeh-events_POST_Request" } } } }
      responses:
        '200':
          $ref: "#/components/responses/HTTP_200_eeh_events"
        default:
          $ref: "#/components/responses/__common_HTTP_default"  
  /example-heartbeats/ping:
    # /<collection>/ping: Change ONLY the name of the collection, operationId, and x-hnb:scopes here.
    get:
      operationId: getExampleHeartbeatsPing
      tags: ["Ping"]
      summary: "Returns canned message from the application"
      description: "Routes through the AGW to the backend to confirm the backend is available."
      x-hnb.scopes: ["ex-hrtbt:read"]
      # Security - change the above line to include your appropriate scopes from the master list at the top of this OAS.
      x-hnb.target.override:
        # The x-hnb.target is designed to handle mainframe (CORE), OCP, GCP, and EQH.  Remove those that are not germane to your API.
        # If your API is not deployed in multiple different technology stacks, then the x-hnb.target.override and the applicationSystemFlow parameter are not required and should be removed.
        - default: CORE
        - condition:
          operator: equals
          applicationSystemFlow: ocp
          target: OCP
        - condition:
          operator: equals
          applicationSystemFlow: gcp
          target: GCP
        - condition:
          operator: equals
          applicationSystemFlow: core
          target: CORE
        - condition:
          operator: equals
          applicationSystemFlow: eqh
          target: EQH
      parameters:
        # There are NO parameters (except applicationSystemFlow as described above)
        - $ref: "#/components/parameters/__common_applicationSystemFlow_Query"
      responses:
        # Only the 200 response is expected outside of standard failures
        '200':
          $ref: "#/components/responses/__common_ping_HTTP_200"
        '401':
          $ref: "#/components/responses/__common_HTTP_401"
        '403':
          $ref: "#/components/responses/__common_HTTP_403"
        default:
          $ref: "#/components/responses/__common_HTTP_default"
  /ping:
    # /ping: Only change the operationId.
    get:
      operationId: getExampleHeartbeatsPingProxy
      tags: ["Ping"]
      summary: "Returns canned message from the AGW"
      description: "Used to confirm the proxy is available on the AGW."

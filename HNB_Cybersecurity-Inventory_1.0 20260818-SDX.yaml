openapi: 3.0.3
####################
# info
#
# Huntington Server Inventory API - READ-ONLY
# Queries the Huntington Source of Truth (SoR) for server inventory data.
# Default target is EQH (Enterprise Query Hub).
#
info:
  contact:
    name: Cybersecurity Architecture
    url: https://huntingtoncloud.sharepoint.com/sites/APIGovernanceStandards
    email: Cybersecurity.Architecture@huntington.com
  # Title follows convention: "Huntington <Collection Name> API"
  title: Huntington Server Inventory API
  description: Retrieve and search server inventory records from the Huntington Source of Record, including asset identification, classification, and ownership. Compliance, patch, and detailed vulnerability data are managed in other systems (e.g. Zafran) and are not exposed by this API.
  x-hnb.collection:
    - oas: "servers"
    - code: "servers"
    - resourceDefinition:
        $ref: "#/components/schemas/servers_RESOURCE"
  # Major.Minor.Point - increment patch on any approved change
  version: 1.0.0
  # Combined list of all scopes referenced within this document (read-only)
  x-hnb.scopes: ["srv:read"]
  x-hnb.target:
    # Default for GET operations is EQH (Enterprise Query Hub)
    - default: EQH
    - dv:
        audience: https://hnb-srv-1-0-placeholder-dv-uc.a.run.app
        endpoint: https://hnb-srv-1-0-placeholder-dv-uc.a.run.app/hnb-srv/1.0
    - in:
        audience: https://hnb-srv-1-0-placeholder-in-uc.a.run.app
        endpoint: https://hnb-srv-1-0-placeholder-in-uc.a.run.app/hnb-srv/1.0
    - qa:
        audience: https://hnb-srv-1-0-placeholder-qa-uc.a.run.app
        endpoint: https://hnb-srv-1-0-placeholder-qa-uc.a.run.app/hnb-srv/1.0
    - st:
        audience: https://hnb-srv-1-0-placeholder-st-uc.a.run.app
        endpoint: https://hnb-srv-1-0-placeholder-st-uc.a.run.app/hnb-srv/1.0
    - tr:
        audience: https://hnb-srv-1-0-placeholder-tr-uc.a.run.app
        endpoint: https://hnb-srv-1-0-placeholder-tr-uc.a.run.app/hnb-srv/1.0
    - pd:
        audience: https://hnb-srv-1-0-placeholder-pd-uc.a.run.app
        endpoint: https://hnb-srv-1-0-placeholder-pd-uc.a.run.app/hnb-srv/1.0
  # Replace with actual CMDB Correlation ID for the Cybersecurity team
  x-hnb.cmdbCorrelationId: "900110"
  x-hnb.cmdbName: "Server Inventory"
  x-hnb.ownerEmail: Cybersecurity.Architecture@huntington.com
  x-hnb.approverEmail: Cybersecurity.Architecture@huntington.com
  # Standard idempotency (not required for read-only; set to Disabled for GET-only APIs)
  x-hnb.idempotency: 'Disabled'
  # HNB classification: this is an internal Huntington API
  x-hnb.proxyPrefix: 'HNB'
  x-hnb.quota:
    - environment: np
      values:
      - type: Bronze
        count: 10
        interval: 1
        timeUnit: minute
      - type: Silver
        count: 100
        interval: 1
        timeUnit: minute
      - type: Gold
        count: 1000
        interval: 1
        timeUnit: minute
    - environment: pd
      values:
      - type: Bronze
        count: 500
        interval: 1
        timeUnit: minute
      - type: Silver
        count: 5000
        interval: 1
        timeUnit: minute
      - type: Gold
        count: 10000
        interval: 1
        timeUnit: minute
  #
  # info END
  ####################
tags:
  - name: Servers
    description: "Operations on the Server Collection"
  - name: Server
    description: "Operations on a specific Server Resource"
  - name: Ping
    description: "Operations to test availability"
  #
  # tags END
  ####################
servers:
  ####################
  # servers
  #
  - url: "https://localhost:8080/{module}/{version}"
    description: Execute locally
    variables: { module:{ enum: [hnb-srv], default: hnb-srv }, version:{ enum: ["1.0"], default: "1.0"} }
  - url: "https://{mock}-{env}-int.hban.us/{module}/{version}"
    description: (DV, IN, QA, ST, TR) Internal AGW
    variables: { module:{ enum: [hnb-srv], default: hnb-srv }, version:{ enum: ["1.0"], default: "1.0"},
    mock:{ enum: [mock-agw,agw], default: mock-agw }, env:{ enum: [dv,in,qa,st,tr], default: in } }
  - url: "https://{mock}-{env}-ext{mtls}.huntington.com/{module}/{version}"
    description: (IN, QA, ST, TR) External (Colleague/Partner) AGW
    variables: { module:{ enum: [hnb-srv], default: hnb-srv }, version:{ enum: ["1.0"], default: "1.0"},
    mock:{ enum: [mock-agw,agw], default: mock-agw }, env:{ enum: [dv,in,qa,st,tr], default: in },
    mtls:{ enum: ["","-mtls"], default: "" } }
  - url: "https://{mock}-int.hban.us/{module}/{version}"
    description: PD (Production) Internal AGW
    variables: { module:{ enum: [hnb-srv], default: hnb-srv }, version:{ enum: ["1.0"], default: "1.0"},
    mock:{ enum: [mock-agw,agw], default: mock-agw } }
  - url: "https://{mock}-ext{mtls}.huntington.com/{module}/{version}"
    description: PD (Production) External (Colleague/Partner) AGW
    variables: { module:{ enum: [hnb-srv], default: hnb-srv }, version:{ enum: ["1.0"], default: "1.0"},
    mock:{ enum: [mock-agw,agw], default: mock-agw }, mtls:{ enum: ["","-mtls"], default: "" } }
  #
  # servers END
  ####################
paths:
  ####################
  # paths - READ-ONLY: GET operations only (no POST create, PUT, PATCH, DELETE, EEH)
  #
  /servers/summary:
    get:
      operationId: getServersSummary
      tags: ["Servers"]
      summary: "Retrieve a list of (aka search for) Servers with brief details"
      description: |
        Returns a brief subset of fields (serverId and description) for each matching server.
        A GET against the collection with the /summary limiter is effectively a search and will return HTTP 200 even when no records match.
        Use this operation to populate selection lists or dashboards without fetching the full asset payload.

        | HTTP Status | severity | statusCode | Use Case when returned |
        |-------------|----------|------------|------------------------|
        | 200         | info     | HNB+0004   | No Server Records Found |
      x-hnb.scopes: ["srv:read"]
      parameters:
        - $ref: "#/components/parameters/servers_description_Query"
        - $ref: "#/components/parameters/servers_assetName_Query"
        - $ref: "#/components/parameters/servers_assetType_Query"
        - $ref: "#/components/parameters/__common_periodReference_Query"
        - $ref: "#/components/parameters/__common_correlationId_Query"
        - $ref: "#/components/parameters/__common_resourceTimestamp_Query"
        - $ref: "#/components/parameters/__common_observedTimestamp_Query"
        - $ref: "#/components/parameters/__common_sort_by_Query"
        - $ref: "#/components/parameters/__common_item_offset_Query"
        - $ref: "#/components/parameters/__common_result_next_Query"
        - $ref: "#/components/parameters/__common_item_count_Query"
        - $ref: "#/components/parameters/__common_include_total_results_Query"
      responses:
        '200':
          $ref: "#/components/responses/HTTP_200_collection_summary"
        '400':
          $ref: "#/components/responses/__common_HTTP_400"
        '401':
          $ref: "#/components/responses/__common_HTTP_401"
        '403':
          $ref: "#/components/responses/__common_HTTP_403"
        '500':
          $ref: "#/components/responses/__common_HTTP_500"
        default:
          $ref: "#/components/responses/__common_HTTP_default"

  /servers:
    get:
      operationId: getServersCollection
      tags: ["Servers"]
      summary: "Retrieve a list of (aka search for) Servers"
      description: |
        Searches the server collection and returns matching resources with all fields (unless a subset is specified via field_list).
        A properly formed search that yields zero results returns HTTP 200. The EQH enables query parameters for any field in the collection.

        | HTTP Status | severity | statusCode | Use Case when returned |
        |-------------|----------|------------|------------------------|
        | 200         | info     | HNB+0004   | No Server Records Found |
      x-hnb.scopes: ["srv:read"]
      parameters:
        - $ref: "#/components/parameters/servers_description_Query"
        - $ref: "#/components/parameters/servers_assetName_Query"
        - $ref: "#/components/parameters/servers_assetType_Query"
        - $ref: "#/components/parameters/servers_criticality_Query"
        - $ref: "#/components/parameters/servers_status_Query"
        - $ref: "#/components/parameters/__common_periodReference_Query"
        - $ref: "#/components/parameters/__common_correlationId_Query"
        - $ref: "#/components/parameters/__common_resourceTimestamp_Query"
        - $ref: "#/components/parameters/__common_observedTimestamp_Query"
        - $ref: "#/components/parameters/__common_sort_by_Query"
        - $ref: "#/components/parameters/__common_item_offset_Query"
        - $ref: "#/components/parameters/__common_result_next_Query"
        - $ref: "#/components/parameters/__common_item_count_Query"
        - $ref: "#/components/parameters/__common_include_total_results_Query"
        - $ref: "#/components/parameters/__common_count_only_Query"
        - $ref: "#/components/parameters/__common_include_metadata_Query"
        - $ref: "#/components/parameters/__common_field_list_Query"
        - $ref: "#/components/parameters/__common_expand_resources_Query"
      responses:
        '200':
          $ref: "#/components/responses/HTTP_200_collection"
        '400':
          $ref: "#/components/responses/__common_HTTP_400"
        '401':
          $ref: "#/components/responses/__common_HTTP_401"
        '403':
          $ref: "#/components/responses/__common_HTTP_403"
        '500':
          $ref: "#/components/responses/__common_HTTP_500"
        default:
          $ref: "#/components/responses/__common_HTTP_default"

  /servers/retrieve/summary:
    post:
      operationId: retrieveServersSummary
      tags: ["Servers"]
      summary: "Retrieve (via a POST) a list of Servers with brief details"
      description: |
        Behaves and returns the same content as GET /servers/summary but uses a POST to enforce encryption of sensitive query criteria (e.g. IP addresses) and/or to support complex query operations beyond simple AND URL parameters.
      x-hnb.scopes: ["srv:read"]
      parameters:
        - $ref: "#/components/parameters/__common_periodReference_Query"
        - $ref: "#/components/parameters/__common_correlationId_Query"
        - $ref: "#/components/parameters/__common_resourceTimestamp_Query"
        - $ref: "#/components/parameters/__common_observedTimestamp_Query"
        - $ref: "#/components/parameters/__common_sort_by_Query"
        - $ref: "#/components/parameters/__common_item_offset_Query"
        - $ref: "#/components/parameters/__common_result_next_Query"
        - $ref: "#/components/parameters/__common_item_count_Query"
        - $ref: "#/components/parameters/__common_include_total_results_Query"
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/retrieve_POST_Request" } } } }
      responses:
        '200':
          $ref: "#/components/responses/HTTP_200_collection_summary_retrieve"
        '400':
          $ref: "#/components/responses/__common_HTTP_400"
        '401':
          $ref: "#/components/responses/__common_HTTP_401"
        '403':
          $ref: "#/components/responses/__common_HTTP_403"
        '500':
          $ref: "#/components/responses/__common_HTTP_500"
        default:
          $ref: "#/components/responses/__common_HTTP_default"

  /servers/retrieve:
    post:
      operationId: retrieveServers
      tags: ["Servers"]
      summary: "Retrieve (via a POST) a list of Servers"
      description: |
        Behaves and returns the same content as GET /servers but uses a POST to enforce encryption of sensitive query criteria (e.g. IP addresses, MAC addresses) and/or to support complex query operations.
        Standard non-API-specific parameters (e.g. include_metadata, sort_by) may still be provided as URL query parameters. Only API-specific fields need to be in the /retrieve request body.
      x-hnb.scopes: ["srv:read"]
      parameters:
        - $ref: "#/components/parameters/__common_periodReference_Query"
        - $ref: "#/components/parameters/__common_correlationId_Query"
        - $ref: "#/components/parameters/__common_resourceTimestamp_Query"
        - $ref: "#/components/parameters/__common_observedTimestamp_Query"
        - $ref: "#/components/parameters/__common_sort_by_Query"
        - $ref: "#/components/parameters/__common_item_offset_Query"
        - $ref: "#/components/parameters/__common_result_next_Query"
        - $ref: "#/components/parameters/__common_item_count_Query"
        - $ref: "#/components/parameters/__common_include_total_results_Query"
        - $ref: "#/components/parameters/__common_count_only_Query"
        - $ref: "#/components/parameters/__common_include_metadata_Query"
        - $ref: "#/components/parameters/__common_field_list_Query"
        - $ref: "#/components/parameters/__common_expand_resources_Query"
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/retrieve_POST_Request" } } } }
      responses:
        '200':
          $ref: "#/components/responses/HTTP_200_collection_retrieve"
        '400':
          $ref: "#/components/responses/__common_HTTP_400"
        '401':
          $ref: "#/components/responses/__common_HTTP_401"
        '403':
          $ref: "#/components/responses/__common_HTTP_403"
        '500':
          $ref: "#/components/responses/__common_HTTP_500"
        default:
          $ref: "#/components/responses/__common_HTTP_default"

  /servers/{serverId}/summary:
    get:
      operationId: getServerSummary
      tags: ["Server"]
      summary: "Retrieve a specific Server with brief details"
      description: |
        Returns the brief subset of fields (serverId and description) for the specified server.
        If the specified resource does not exist, a 404 Not Found is returned — this is NOT a search.

        | HTTP Status | severity | statusCode | Use Case when returned |
        |-------------|----------|------------|------------------------|
        | 404         | error    | HNB-0008   | Resource Not Found     |
      x-hnb.scopes: ["srv:read"]
      parameters:
        - $ref: "#/components/parameters/serverId_Path"
      responses:
        '200':
          $ref: "#/components/responses/HTTP_200_summary"
        '400':
          $ref: "#/components/responses/__common_HTTP_400"
        '401':
          $ref: "#/components/responses/__common_HTTP_401"
        '403':
          $ref: "#/components/responses/__common_HTTP_403"
        '404':
          $ref: "#/components/responses/__common_HTTP_404"
        '500':
          $ref: "#/components/responses/__common_HTTP_500"
        default:
          $ref: "#/components/responses/__common_HTTP_default"

  /servers/{serverId}:
    get:
      operationId: getServer
      tags: ["Server"]
      summary: "Retrieve a specific Server"
      description: |
        Returns the requested server resource with all of its fields (unless a subset is specified via field_list).
        If the specified resource does not exist, a 404 Not Found is returned — this is NOT a search.
        Supports expand_resources to inline referenced sub-collections (e.g. owner details).

        | HTTP Status | severity | statusCode | Use Case when returned |
        |-------------|----------|------------|------------------------|
        | 404         | error    | HNB-0008   | Resource Not Found     |
      x-hnb.scopes: ["srv:read"]
      parameters:
        - $ref: "#/components/parameters/serverId_Path"
        - $ref: "#/components/parameters/__common_include_metadata_Query"
        - $ref: "#/components/parameters/__common_field_list_Query"
        - $ref: "#/components/parameters/__common_expand_resources_Query_true"
        - $ref: "#/components/parameters/__common_return_history_Query"
      responses:
        '200':
          $ref: "#/components/responses/HTTP_200_EXPANDEDRESOURCE"
        '400':
          $ref: "#/components/responses/__common_HTTP_400"
        '401':
          $ref: "#/components/responses/__common_HTTP_401"
        '403':
          $ref: "#/components/responses/__common_HTTP_403"
        '404':
          $ref: "#/components/responses/__common_HTTP_404"
        '500':
          $ref: "#/components/responses/__common_HTTP_500"
        default:
          $ref: "#/components/responses/__common_HTTP_default"

  /servers/ping:
    get:
      operationId: getServersPing
      tags: ["Ping"]
      summary: "Returns canned message from the application"
      description: "Routes through the AGW to the backend to confirm the backend is available."
      x-hnb.scopes: ["srv:read"]
      responses:
        '200':
          $ref: "#/components/responses/__common_ping_HTTP_200"
        '401':
          $ref: "#/components/responses/__common_HTTP_401"
        '403':
          $ref: "#/components/responses/__common_HTTP_403"
        default:
          $ref: "#/components/responses/__common_HTTP_default"

  /ping:
    get:
      operationId: getServersPingProxy
      tags: ["Ping"]
      summary: "Returns canned message from the AGW"
      description: "Used to confirm the proxy is available on the AGW."
      x-hnb.scopes: []
      security: []
      responses:
        '200':
          $ref: "#/components/responses/__common_ping_HTTP_200"
        default:
          $ref: "#/components/responses/__common_HTTP_default"
  #
  # paths END
  ####################
security:
  - Auth_Bearer: []
    Auth_originatingChannel: []
    Auth_requestingChannel: []
    Auth_correlationId: []
    Auth_messageHash: []
    Auth_sessionId: []
    Auth_requestingCustomer: []
  #
  # security END
  ####################
components:
  ####################
  # common components - DO NOT MODIFY from here to "common components END"
  securitySchemes:
    Auth_sessionId:
      type: apiKey
      name: sessionId
      in: header
      description: "Unique Id for overall user session generated by the caller - ideally a GUID/UUID - but any opaque string. This Id would be used on ALL API calls made within that session."
    Auth_correlationId:
      type: apiKey
      name: _correlationId
      in: query
      description: "Unique Id for the initiating request generated by the caller - ideally a GUID/UUID - but any opaque string. The prefix _ is used on a GET or DELETE operation (that does not have a payload) to assign the correlationId for this request."
    Auth_originatingChannel:
      type: apiKey
      name: X-HNB.originatingChannel
      in: header
      description: "CMDB Correlation (or Assigned) Id of Application originating the request"
    Auth_requestingChannel:
      type: apiKey
      name: X-HNB.requestingChannel
      in: header
      description: "CMDB Correlation (or Assigned) Id of Application making the actual request (may differ from X-HNB.originatingChannel if request is relayed)"
    Auth_Bearer:
      type: http
      description: "Enter the OAuth2 token as issued by the AGW"
      scheme: bearer
    Auth_messageHash:
      type: apiKey
      name: X-HNB.messageHash
      in: header
      description: "Hash of the message that can be used to validate the body was not modified"
    Auth_requestingCustomer:
      type: apiKey
      name: X-HNB.requestingCustomer
      in: header
      description: "Customer that is authenticated and initiating the request (ADDED TEMPORARILY until the customer's identifying data is based on the OAuth2 Header)"

  responses:
    #
    # common responses
    #
    HTTP_200:
      description: OK - The operation was successful.
      headers:
        X-HNB.messageHash:
          schema:
            $ref: "#/components/schemas/__common_messageHash"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Response"
    HTTP_200_EXPANDEDRESOURCE:
      description: OK - The operation was successful.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Response_EXPANDEDRESOURCE"
      headers:
        X-HNB.messageHash:
          schema:
            $ref: "#/components/schemas/__common_messageHash"
    HTTP_200_collection:
      description: OK - The operation was successful.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Response_collection"
      headers:
        X-HNB.messageHash:
          schema:
            $ref: "#/components/schemas/__common_messageHash"
    HTTP_200_collection_retrieve:
      description: OK - The operation was successful.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Response_collection_retrieve"
      headers:
        X-HNB.messageHash:
          schema:
            $ref: "#/components/schemas/__common_messageHash"
    HTTP_200_summary:
      description: OK - The operation was successful.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Response_summary"
      headers:
        X-HNB.messageHash:
          schema:
            $ref: "#/components/schemas/__common_messageHash"
    HTTP_200_collection_summary:
      description: OK - The operation was successful.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Response_collection_summary"
      headers:
        X-HNB.messageHash:
          schema:
            $ref: "#/components/schemas/__common_messageHash"
    HTTP_200_collection_summary_retrieve:
      description: OK - The operation was successful.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Response_collection_summary_retrieve"
      headers:
        X-HNB.messageHash:
          schema:
            $ref: "#/components/schemas/__common_messageHash"
    __common_HTTP_202:
      description: Accepted - The operation has been accepted for processing but the processing has not been completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_204:
      description: No Content - The operation was successful, but no additional response is included.
    __common_HTTP_207:
      description: Multi-status - The operation has been processed with different results for each resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_301:
      description: Moved permanently.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_302:
      description: Found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_303:
      description: See Other.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_306:
      description: Use Proxy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_307:
      description: Temporary Redirect.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_400:
      description: Bad Request - The request was invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_401:
      description: Unauthorized - The request did not include an authentication token or the authentication token was expired.
      content: {}
    __common_HTTP_403:
      description: Forbidden - The client did not have permission to access the requested resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_404:
      description: Not Found - The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_405:
      description: Method Not Allowed - The HTTP method in the request was not supported by the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_406:
      description: Not Acceptable - The target resource does not have a current representation that would be acceptable to the user agent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_409:
      description: Conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_415:
      description: Unsupported Media Type.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_422:
      description: Unprocessable Entity - the server is unable to process the contained instructions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_500:
      description: Internal Server Error - The request was not completed due to an internal error on the server side.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_501:
      description: Not Implemented - The server does not support the functionality required to fulfill the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_502:
      description: Bad Gateway.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/__common_Error_Response"
    __common_HTTP_503:
      description: Service Unavailable - The server was unavailable.
      content:
        application/json:
          schema:

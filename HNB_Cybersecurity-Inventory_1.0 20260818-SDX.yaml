    retrieve_collectionFields:
      type: object
      properties:
        description:
          $ref: "#/components/schemas/servers_description"
        assetName:
          $ref: "#/components/schemas/servers_assetName"
        assetType:
          $ref: "#/components/schemas/servers_assetType"
        ipAddress:
          $ref: "#/components/schemas/servers_ipAddress"
        macAddress:
          $ref: "#/components/schemas/servers_macAddress"
        criticality:
          $ref: "#/components/schemas/servers_criticality"
        status:
          $ref: "#/components/schemas/servers_status"

    servers_base:
      type: object
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/servers_RESOURCE"

    servers_base_EXPANDEDRESOURCE:
      type: object
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/servers_EXPANDEDRESOURCE"

    servers_base_summary:
      type: object
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/servers_SUMMARY"

    servers_SUMMARY:
      type: object
      properties:
        serverId:
          $ref: "#/components/schemas/serverId"
        description:
          $ref: "#/components/schemas/servers_description"

    servers_RESOURCE:
      type: object
      properties:
        serverId:
          $ref: "#/components/schemas/serverId"
        description:
          $ref: "#/components/schemas/servers_description"
        assetName:
          $ref: "#/components/schemas/servers_assetName"
        assetType:
          $ref: "#/components/schemas/servers_assetType"
        criticality:
          $ref: "#/components/schemas/servers_criticality"
        status:
          $ref: "#/components/schemas/servers_status"
        operatingSystem:
          $ref: "#/components/schemas/servers_operatingSystem"
        operatingSystemVersion:
          $ref: "#/components/schemas/servers_operatingSystemVersion"
        ipAddress:
          $ref: "#/components/schemas/servers_ipAddress"
        macAddress:
          $ref: "#/components/schemas/servers_macAddress"
        lastDiscoveredTimestamp:
          $ref: "#/components/schemas/servers_lastDiscoveredTimestamp"
        location:
          $ref: "#/components/schemas/servers_location"
        owner:
          $ref: "#/components/schemas/servers_owner"
        _metadata:
          $ref: "#/components/schemas/__common_metadata_included"

    servers_EXPANDEDRESOURCE:
      $ref: "#/components/schemas/servers_RESOURCE"

    ####################
    # Field definitions - namespaced with collection name
    serverId:
      maxLength: 36
      minLength: 1
      type: string
      description: "Unique identifier of a Server - nominally a GUID/UUID (opaque string; do not parse)"
      example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    servers_description:
      maxLength: 256
      minLength: 1
      type: string
      description: "Brief human-readable description of the server (every resource must include a description)"
      example: "Primary web application server in DMZ"

    servers_assetName:
      maxLength: 128
      minLength: 1
      type: string
      description: "Hostname or display name of the asset as registered in the inventory source of truth"
      example: "WEBSVR-DMZ-001"

    servers_assetType:
      maxLength: 64
      minLength: 1
      type: string
      description: "Classification type of the server as recorded in the CMDB. Scoped to server records only; operating system variation is captured separately via operatingSystem/operatingSystemVersion."
      example: "Server"
      enum:
        - Server
        - VirtualMachine
        - CloudInstance
        - ContainerHost
        - Unknown

    servers_criticality:
      maxLength: 16
      minLength: 1
      type: string
      description: "Criticality rating of the asset based on business impact assessment"
      example: "High"
      enum:
        - Critical
        - High
        - Medium
        - Low

    servers_status:
      maxLength: 32
      minLength: 1
      type: string
      description: "Operational status of the server"
      example: "Active"
      enum:
        - Active
        - Inactive
        - Decommissioned
        - UnderMaintenance
        - Unknown

    servers_operatingSystem:
      maxLength: 128
      minLength: 1
      type: string
      description: "Operating system installed on the asset"
      example: "Red Hat Enterprise Linux"

    servers_operatingSystemVersion:
      maxLength: 64
      minLength: 1
      type: string
      description: "Version string of the installed operating system"
      example: "9.2"

    servers_ipAddress:
      maxLength: 45
      minLength: 7
      type: string
      description: "Primary IP address of the asset (IPv4 or IPv6). Treated as sensitive - prefer /retrieve for IP-based queries."
      # x-hnb.logging: sensitive field; restrict logging in implementation
      example: "10.20.30.40"

    servers_macAddress:
      maxLength: 17
      minLength: 17
      type: string
      description: "Primary MAC address of the asset in colon-delimited format. Treated as sensitive - prefer /retrieve for MAC-based queries."
      example: "AA:BB:CC:DD:EE:FF"

    servers_lastDiscoveredTimestamp:
      maxLength: 32
      minLength: 1
      type: string
      description: "Timestamp of the most recent inventory discovery scan that observed this server in the source of truth. Reflects asset discovery, not vulnerability scanning. ISO 8601 format."
      example: "2024-08-01T02:00:00.000000Z"

    servers_location:
      type: object
      description: "Physical or logical location information for the asset"
      properties:
        dataCenterId:
          type: string
          maxLength: 36
          minLength: 1
          description: "CMDB Correlation ID of the data center or cloud region hosting the asset"
          example: "301200"
        dataCenterName:
          type: string
          maxLength: 128
          minLength: 1
          description: "Human-readable name of the data center or cloud region"
          example: "Columbus Data Center"
        environment:
          type: string
          maxLength: 32
          minLength: 1
          description: "Deployment environment of the asset"
          example: "Production"
          enum:
            - Production
            - NonProduction
            - Development
            - Test
            - Unknown

    servers_owner:
      type: object
      description: "Ownership details for the server including the responsible IT team"
      properties:
        ownerTeamId:
          type: string
          maxLength: 36
          minLength: 1
          description: "CMDB Correlation ID of the IT team responsible for this asset"
          example: "301196"
        ownerTeamName:
          type: string
          maxLength: 128
          minLength: 1
          description: "Human-readable name of the IT team responsible for this asset"
          example: "Cybersecurity Architecture"
        ownerEmail:
          type: string
          maxLength: 256
          minLength: 5
          description: "Contact email for the team responsible for this asset"
          example: "Cybersecurity.Architecture@huntington.com"
    #
    # collection-specific fields END
    ###############################################################

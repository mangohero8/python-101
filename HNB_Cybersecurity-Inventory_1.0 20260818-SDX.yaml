        payload: { $ref: "#/components/schemas/servers_base_summary" }

    ####################
    # /retrieve support
    retrieve_POST_Request:
      required: [_metadata,payload]
      type: object
      properties:
        _metadata:
          $ref: "#/components/schemas/__common_metadata_Request_agw"
        payload:
          required: [servers_retrieve]
          type: object
          properties:
            servers_retrieve:
              type: array
              description: "Fields provided for complex or encrypted queries instead of URL query parameters. AND'ed with any query parameters from the operation."
              minItems: 1
              maxItems: 1
              items:
                type: object
                properties:
                  parameters:
                    type: array
                    description: "Operator-based field tests AND'ed with payload fields and query parameters."
                    minItems: 0
                    maxItems: 8
                    items:
                      type: object
                      properties:
                        periodReference:
                          $ref: "#/components/schemas/__common_periodReference"
                        correlationId:
                          $ref: "#/components/schemas/__common_correlationId"
                        resourceTimestamp:
                          $ref: "#/components/schemas/__common_resourceTimestamp"
                        observedTimestamp:
                          $ref: "#/components/schemas/__common_observedTimestamp"
                        collectionFields:
                          $ref: "#/components/schemas/retrieve_collectionFields"
                        operator:
                          $ref: "#/components/schemas/__common_operator"
                    example:
                      [
                        {
                          "collectionFields": { "ipAddress": "10.0.0.1" },
                          "operator": "equal"
                        },
                        {
                          "resourceTimestamp": "2024-01-01T00:00:00.000000+00:00",
                          "operator": "greaterThanOrEqual"
                        }
                      ]
                  collectionFields:
                    $ref: "#/components/schemas/retrieve_collectionFields"

    __common_operator:
      type: string
      description: "Operator used to test value of field"
      example: "equal"
      enum: ['lessThan','lessThanOrEqual','equal','notEqual','greaterThanOrEqual','greaterThan','beginsWith','endsWith','contains','doesNotContain']

    ####################
    # collection-specific schemas
    # - The resourceId (serverId) is NOT namespaced per convention
    # - All other fields are namespaced with the collection name (servers_)
